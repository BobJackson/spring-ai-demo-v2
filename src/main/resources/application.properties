spring.application.name=spring-ai-demo
spring.ai.chat.chunk-size=100

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/chatdb?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456

spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:org/springframework/ai/chat/memory/repository/jdbc/schema-mysql.sql